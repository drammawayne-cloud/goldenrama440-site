name: Build approved Golden Rama public previews
on:
  workflow_dispatch:
  push:
    branches: [feat/golden-radio-audio-previews]
    paths:
      - scripts/generate-golden-previews.py
      - .github/workflows/build-golden-previews.yml
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install public-download tool
        run: python -m pip install gdown==5.2.0
      - name: Download user-approved Golden Rama radio archive
        run: gdown --id 1IAbV-T2hLIZU2GfDa538HUMI3yT1s8JA --output approved.zip
      - name: Generate 30-second clips, never full masters
        run: |
          command -v ffmpeg
          python scripts/generate-golden-previews.py approved.zip previews
          python -c "import json; x=json.load(open('golden-preview-manifest.json')); assert len(x['tracks'])==51"
      - name: Commit only previews and manifest to review branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add previews/ golden-preview-manifest.json
          git commit -m "assets: prepare 51 approved Golden Rama preview clips"
          git push origin HEAD:feat/golden-radio-audio-previews
